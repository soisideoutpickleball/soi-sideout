<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>Soi Sideout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EFE4;
    --cream-card:#FFFBF3;
    --maroon:#8B1E1E;
    --maroon-dark:#6E1717;
    --olive:#5B6E4E;
    --olive-light:#7C8F68;
    --ink:#3A2E26;
    --mustard:#E0A72E;
    --line:#E8DCC8;
    --danger:#B23B3B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{color-scheme:light;}
  body{
    font-family:'Noto Sans Thai','Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .display{font-family:'Baloo 2','Noto Sans Thai',sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:16px;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}

  /* ===== HEADER ===== */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 18px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{
    width:38px;height:38px;border-radius:12px;background:var(--maroon);
    display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;
    box-shadow:0 3px 0 var(--maroon-dark);color:#fff;overflow:hidden;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-text .name{font-family:'Baloo 2';font-weight:700;font-size:19px;color:var(--ink);line-height:1.1;}
  .brand-text .sub{font-size:11px;color:var(--olive);font-weight:600;margin-top:1px;}
  .admin-btn{
    font-size:12px;font-weight:600;color:var(--ink);background:var(--cream-card);
    border:1.5px solid var(--line);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;
  }
  .admin-btn.logged{background:var(--maroon);color:#fff;border-color:var(--maroon-dark);}

  /* ===== BANNER ===== */
  .banner{
    background:var(--olive);border-radius:20px;padding:16px 18px;margin-bottom:18px;
    position:relative;overflow:hidden;box-shadow:0 4px 0 #47563A;
  }
  .banner.live{background:var(--maroon);box-shadow:0 4px 0 var(--maroon-dark);}
  .banner::after{content:'🏓';position:absolute;right:-10px;bottom:-18px;font-size:80px;opacity:0.14;transform:rotate(-12deg);}
  .banner-eyebrow{font-size:11px;font-weight:700;color:#E9F0DF;text-transform:uppercase;letter-spacing:0.6px;display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .banner-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--mustard);display:inline-block;}
  .banner-eyebrow .dot.pulse{animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .banner-title{font-family:'Baloo 2';font-weight:700;font-size:20px;color:#fff;line-height:1.25;position:relative;z-index:1;}
  .banner-meta{display:flex;gap:14px;margin-top:9px;position:relative;z-index:1;flex-wrap:wrap;}
  .banner-meta span{font-size:12.5px;color:#EAF0E1;font-weight:600;display:flex;align-items:center;gap:5px;}

  /* ===== SEARCH / FILTER ===== */
  .search-box{display:flex;align-items:center;gap:8px;background:var(--cream-card);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:12px;}
  .search-box input{border:none;background:transparent;outline:none;font-size:14px;color:var(--ink);width:100%;}
  .search-box input::placeholder{color:#B3A594;}
  .filter-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
  .pill-group{display:flex;gap:6px;flex:1;}
  .pill{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--cream-card);color:var(--ink);cursor:pointer;}
  .pill.active{background:var(--maroon);border-color:var(--maroon-dark);color:#fff;}
  .filter-btn{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--cream-card);border:1.5px solid var(--line);padding:8px 12px;border-radius:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
  .filter-badge{background:var(--mustard);color:var(--ink);font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .section-label{font-size:11px;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:0.6px;margin:4px 0 10px 4px;display:flex;justify-content:space-between;align-items:center;}

  /* ===== LEADERBOARD ===== */
  .board{display:flex;flex-direction:column;gap:9px;}
  .card{display:flex;align-items:center;gap:12px;background:var(--cream-card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;}
  .card.top1{background:linear-gradient(135deg,var(--maroon),#A93030);border-color:var(--maroon-dark);box-shadow:0 3px 0 var(--maroon-dark);}
  .card.top2{background:#FFF3E2;border-color:#F0D9B8;}
  .card.top3{background:#FBF6EA;border-color:#EDE0C4;}
  .rank-badge{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:700;font-size:14px;flex-shrink:0;background:var(--cream);color:var(--ink);border:1.5px solid var(--line);}
  .card.top1 .rank-badge{background:var(--mustard);color:var(--ink);border:none;font-size:17px;}
  .card.top2 .rank-badge{background:#E7C9A3;border-color:#DEBB8E;}
  .card.top3 .rank-badge{background:#E4CFA3;border-color:#D8BE8B;}
  .card-info{flex:1;min-width:0;}
  .card-name{font-weight:700;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:6px;}
  .card.top1 .card-name{color:#fff;}
  .gender-tag{font-size:9.5px;font-weight:700;padding:1.5px 6px;border-radius:8px;background:var(--cream);color:var(--olive);}
  .card.top1 .gender-tag{background:rgba(255,255,255,0.25);color:#fff;}
  .card-sub{font-size:11.5px;color:#8A7D6C;font-weight:600;margin-top:2px;}
  .card.top1 .card-sub{color:rgba(255,255,255,0.85);}
  .card-stats{text-align:right;flex-shrink:0;}
  .stat-score{font-family:'Baloo 2';font-weight:700;font-size:17px;color:var(--maroon);}
  .card.top1 .stat-score{color:#fff;}
  .stat-winrate{font-size:11px;font-weight:700;color:var(--olive);margin-top:1px;}
  .card.top1 .stat-winrate{color:#F4E9D8;}
  .empty-note{text-align:center;padding:30px 10px;color:#B3A594;font-size:13px;font-weight:600;}
  .footer-note{text-align:center;font-size:11px;color:#B3A594;margin-top:22px;font-weight:500;}

  /* ===== BUTTONS ===== */
  .btn{padding:12px 18px;border-radius:14px;font-weight:700;font-size:13.5px;border:none;cursor:pointer;}
  .btn-primary{background:var(--maroon);color:#fff;box-shadow:0 3px 0 var(--maroon-dark);}
  .btn-outline{background:var(--cream-card);color:var(--ink);border:1.5px solid var(--line);}
  .btn-olive{background:var(--olive);color:#fff;box-shadow:0 3px 0 #47563A;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;}

  /* ===== MODAL / SHEET ===== */
  .overlay{position:fixed;inset:0;background:rgba(58,46,38,0.5);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .overlay.show{display:flex;}
  .overlay.center{align-items:center;padding:16px;}
  .sheet{background:var(--cream);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 18px 26px;max-height:88vh;overflow-y:auto;}
  .overlay.center .sheet{border-radius:22px;max-height:88vh;}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}
  .sheet-title{font-family:'Baloo 2';font-weight:700;font-size:18px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{font-size:12px;font-weight:700;color:var(--olive);display:block;margin-bottom:5px;}
  .field input,.field select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream-card);font-size:14px;color:var(--ink);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--maroon);}
  .row2{display:flex;gap:10px;}
  .row2>*{flex:1;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.25);max-width:90vw;text-align:center;}

  /* ===== ADMIN ===== */
  .admin-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
  .admin-tab{padding:8px 14px;border-radius:12px;font-size:12.5px;font-weight:700;background:var(--cream-card);border:1.5px solid var(--line);color:var(--ink);cursor:pointer;white-space:nowrap;}
  .admin-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cream-card);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;}
  .list-item .name{font-weight:700;font-size:13.5px;}
  .list-item .meta{font-size:11px;color:#8A7D6C;font-weight:600;margin-top:2px;}
  .status-tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;}
  .status-upcoming{background:#E9EFE0;color:var(--olive);}
  .status-active{background:#FBEAD0;color:var(--mustard);}
  .status-completed{background:#EEE7DA;color:#8A7D6C;}
  .status-left{background:#F5DEDE;color:var(--danger);}
  .status-checkedin{background:#E4EEDA;color:var(--olive);}

  .match-card{background:var(--cream-card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
  .team-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
  .team-names{font-weight:700;font-size:13.5px;}
  .score-input{width:56px;padding:8px;text-align:center;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-weight:700;}
  .vs-label{font-size:11px;color:#B3A594;font-weight:700;text-align:center;padding:2px 0;}

  .fab{position:fixed;bottom:20px;right:16px;background:var(--maroon);color:#fff;width:56px;height:56px;border-radius:18px;border:none;font-size:24px;box-shadow:0 4px 0 var(--maroon-dark);cursor:pointer;z-index:50;max-width:480px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div style="padding:60px 0;text-align:center;color:#B3A594;font-weight:600;font-size:13px;">กำลังโหลด...</div>
</div>

<!-- ===== ADMIN LOGIN MODAL ===== -->
<div class="overlay center" id="loginOverlay">
  <div class="sheet" style="max-width:340px;">
    <div class="sheet-title display" id="loginTitle">🔐 Admin Login</div>
    <div class="field">
      <label id="loginUserLabel">Username</label>
      <input id="loginUsername" placeholder="username" autocomplete="username">
    </div>
    <div class="field">
      <label id="loginPassLabel">Password</label>
      <input id="loginPassword" type="password" placeholder="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()">
    </div>
    <div class="row2" style="margin-top:16px;">
      <button class="btn btn-outline btn-block" id="loginCancelBtn" onclick="closeLogin()">ยกเลิก</button>
      <button class="btn btn-primary btn-block" id="loginSubmitBtn" onclick="handleLogin()">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- ===== FILTER SHEET ===== -->
<div class="overlay" id="filterOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title display" id="filterTitle">⚙️ ตัวกรอง</div>
    <div class="field">
      <label id="sortByLabel">เรียงตาม</label>
      <select id="sortBy">
        <option value="score" id="sortOpt1">คะแนนรวม สูง → ต่ำ</option>
        <option value="winrate" id="sortOpt2">Win rate สูง → ต่ำ</option>
        <option value="games" id="sortOpt3">จำนวนเกม มาก → น้อย</option>
      </select>
    </div>
    <div class="field">
      <label id="minGamesLabel">เล่นอย่างน้อย (เกม)</label>
      <select id="minGames">
        <option value="0" id="minOpt0" selected>ไม่กรอง</option>
        <option value="3">≥ 3 เกม</option>
        <option value="5">≥ 5 เกม</option>
        <option value="10">≥ 10 เกม</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:8px;" id="applyFilterBtn" onclick="applyFilters()">ใช้ตัวกรอง</button>
  </div>
</div>

<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, getDocs, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwWjtefvxUOT82M4iIRXsHaoW-HVTB_3g",
  authDomain: "soisideout.firebaseapp.com",
  projectId: "soisideout",
  storageBucket: "soisideout.firebasestorage.app",
  messagingSenderId: "1009122426162",
  appId: "1:1009122426162:web:e25c88368eccc22be36b2b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------------- STATE ---------------- */
let isAdmin = false;
let players = [];          // all players from DB
let sessions = [];         // all sessions from DB
let currentSessionId = null; // session admin is currently managing
let currentParticipants = []; // participants of currentSessionId
let currentMatches = [];
let pendingMatch = null;   // {team1:[id,id], team2:[id,id]}
let filterGender = 'all';
let filterSort = 'score';
let filterMinGames = 0;
let searchQuery = '';
let adminTab = 'home'; // home | sessions | players | live
let lang = localStorage.getItem('ss_lang') || 'th';

/* ---------------- I18N ---------------- */
function t(th, en){ return lang==='th' ? th : en; }
window.toggleLang = function(){
  lang = lang==='th' ? 'en' : 'th';
  localStorage.setItem('ss_lang', lang);
  applyStaticTranslations();
  render();
}
function applyStaticTranslations(){
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set('loginTitle', t('🔐 เข้าสู่ระบบ Admin','🔐 Admin Login'));
  set('loginUserLabel', t('ชื่อผู้ใช้','Username'));
  set('loginPassLabel', t('รหัสผ่าน','Password'));
  set('loginCancelBtn', t('ยกเลิก','Cancel'));
  set('loginSubmitBtn', t('เข้าสู่ระบบ','Login'));
  set('filterTitle', t('⚙️ ตัวกรอง','⚙️ Filters'));
  set('sortByLabel', t('เรียงตาม','Sort by'));
  set('sortOpt1', t('คะแนนรวม สูง → ต่ำ','Total score high → low'));
  set('sortOpt2', t('Win rate สูง → ต่ำ','Win rate high → low'));
  set('sortOpt3', t('จำนวนเกม มาก → น้อย','Games played high → low'));
  set('minGamesLabel', t('เล่นอย่างน้อย (เกม)','Minimum games played'));
  set('minOpt0', t('ไม่กรอง','No filter'));
  set('applyFilterBtn', t('ใช้ตัวกรอง','Apply filters'));
}

/* ---------------- HELPERS ---------------- */
function esc(s){
  if (s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function usernameToEmail(u){ return `${u.toLowerCase().trim()}@soisideout.local`; }
function toast(msg, color){
  const t = document.createElement('div');
  t.className = 'toast';
  if (color) t.style.background = color;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function winrate(p){
  const total = (p.totalWins||0)+(p.totalLosses||0);
  if (!total) return 0;
  return Math.round((p.totalWins/total)*100);
}
function genderLabel(g){ return g==='M' ? t('ชาย','Male') : t('หญิง','Female'); }
function fmtDate(d){
  try{
    const dt = new Date(d+'T00:00:00');
    if (lang==='en'){
      return dt.toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' });
    }
    const days=['อา','จ','อ','พ','พฤ','ศ','ส'];
    const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return `${days[dt.getDay()]} ${dt.getDate()} ${months[dt.getMonth()]}`;
  }catch(e){ return d; }
}
function playerById(id){ return players.find(p=>p.id===id); }
function sessionTitle(s){ return s.name ? s.name : fmtDate(s.date); }

/* ---------------- AUTH ---------------- */
window.openLogin = function(){
  document.getElementById('loginOverlay').classList.add('show');
}
window.closeLogin = function(){
  document.getElementById('loginOverlay').classList.remove('show');
}
window.handleLogin = async function(){
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value;
  if (!u || !p){ toast(t('กรอก username และ password','Enter username and password'), '#B23B3B'); return; }
  try{
    await signInWithEmailAndPassword(auth, usernameToEmail(u), p);
    closeLogin();
    toast(t('เข้าสู่ระบบสำเร็จ','Logged in successfully'), '#5B6E4E');
  }catch(e){
    console.error(e);
    toast(t('username หรือ password ไม่ถูกต้อง','Incorrect username or password'), '#B23B3B');
  }
}
window.handleLogout = async function(){
  await signOut(auth);
  adminTab = 'home';
  currentSessionId = null;
  toast(t('ออกจากระบบแล้ว','Logged out'));
}
onAuthStateChanged(auth, (user)=>{
  isAdmin = !!user;
  render();
});

/* ---------------- FIRESTORE LISTENERS ---------------- */
onSnapshot(query(collection(db,'players'), orderBy('totalScore','desc')), (snap)=>{
  players = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});
onSnapshot(collection(db,'sessions'), (snap)=>{
  sessions = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});

function listenSessionDetail(sessionId){
  if (!sessionId) return;
  onSnapshot(collection(db, `sessions/${sessionId}/participants`), (snap)=>{
    currentParticipants = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  onSnapshot(query(collection(db, `sessions/${sessionId}/matches`), orderBy('roundNumber','desc')), (snap)=>{
    currentMatches = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

/* ---------------- GUEST: FILTER ---------------- */
window.setGenderFilter = function(g){
  filterGender = g;
  render();
}
window.openFilterSheet = function(){
  document.getElementById('sortBy').value = filterSort;
  document.getElementById('minGames').value = filterMinGames;
  document.getElementById('filterOverlay').classList.add('show');
}
window.applyFilters = function(){
  filterSort = document.getElementById('sortBy').value;
  filterMinGames = parseInt(document.getElementById('minGames').value);
  document.getElementById('filterOverlay').classList.remove('show');
  render();
}
window.onSearchInput = function(v){
  searchQuery = v.toLowerCase();
  render();
}

function getFilteredPlayers(){
  let list = players.filter(p=>{
    if (filterGender!=='all' && p.gender!==filterGender) return false;
    if (searchQuery && !p.name.toLowerCase().includes(searchQuery)) return false;
    if ((p.totalGamesPlayed||0) < filterMinGames) return false;
    return true;
  });
  if (filterSort==='winrate') list.sort((a,b)=>winrate(b)-winrate(a));
  else if (filterSort==='games') list.sort((a,b)=>(b.totalGamesPlayed||0)-(a.totalGamesPlayed||0));
  else list.sort((a,b)=>(b.totalScore||0)-(a.totalScore||0));
  return list;
}

/* ---------------- ADMIN: PLAYERS ---------------- */
window.openAddPlayer = function(quickCallback){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay show center" id="addPlayerOverlay">
      <div class="sheet" style="max-width:340px;">
        <div class="sheet-title display">+ ${t('เพิ่มผู้เล่นใหม่','Add new player')}</div>
        <div class="field">
          <label>${t('ชื่อ','Name')}</label>
          <input id="newPlayerName" placeholder="${t('ชื่อผู้เล่น','Player name')}" autofocus>
        </div>
        <div class="field">
          <label>${t('เพศ','Gender')}</label>
          <div class="row2">
            <button class="btn btn-outline btn-block" id="genderM" onclick="selectGender('M')">${t('ชาย','Male')}</button>
            <button class="btn btn-outline btn-block" id="genderF" onclick="selectGender('F')">${t('หญิง','Female')}</button>
          </div>
        </div>

window.generateMatch = function(){
  const active = currentParticipants.filter(p=>p.status==='active');
  if (active.length < 4){ toast(t('ต้องมีผู้เล่น active อย่างน้อย 4 คน','Need at least 4 active players'), '#B23B3B'); return; }

  // sort by gamesPlayedToday asc, then waitingSince asc (earlier = longer wait)
  const sorted = [...active].sort((a,b)=>{
    const gp = (a.gamesPlayedToday||0)-(b.gamesPlayedToday||0);
    if (gp!==0) return gp;
    const at = a.waitingSince?.toMillis ? a.waitingSince.toMillis() : 0;
    const bt = b.waitingSince?.toMillis ? b.waitingSince.toMillis() : 0;
    return at-bt;
  });
  const four = sorted.slice(0,4);
  const ids = four.map(p=>p.id);

  // try pairing avoiding last partner
  let bestPairing = null;
  const pairings = [
    [[ids[0],ids[1]],[ids[2],ids[3]]],
    [[ids[0],ids[2]],[ids[1],ids[3]]],
    [[ids[0],ids[3]],[ids[1],ids[2]]]
  ];
  const shuffled = pairings.sort(()=>Math.random()-0.5);
  for (const pairing of shuffled){
    const [t1,t2] = pairing;
    const t1ok = !(four.find(p=>p.id===t1[0]).lastPartnerId === t1[1]);
    const t2ok = !(four.find(p=>p.id===t2[0]).lastPartnerId === t2[1]);
    if (t1ok && t2ok){ bestPairing = pairing; break; }
  }
  if (!bestPairing) bestPairing = shuffled[0];

  pendingMatch = { team1: bestPairing[0], team2: bestPairing[1] };
  render();
}
window.cancelPendingMatch = function(){
  pendingMatch = null;
  render();
}
window.reshuffleMatch = function(){
  generateMatch();
}
window.confirmAndRecordMatch = async function(){
  const s1 = parseInt(document.getElementById('scoreT1').value);
  const s2 = parseInt(document.getElementById('scoreT2').value);
  if (isNaN(s1)||isNaN(s2)){ toast(t('กรอกคะแนนให้ครบ','Enter both scores'), '#B23B3B'); return; }
  if (s1===s2){ toast(t('คะแนนห้ามเท่ากัน (ไม่มีเสมอ)','Scores cannot be equal (no ties)'), '#B23B3B'); return; }

  const [t1a,t1b] = pendingMatch.team1;
  const [t2a,t2b] = pendingMatch.team2;
  const winnerTeam = s1>s2 ? 1 : 2;
  const diff = Math.abs(s1-s2);
  const winIds = winnerTeam===1 ? [t1a,t1b] : [t2a,t2b];
  const loseIds = winnerTeam===1 ? [t2a,t2b] : [t1a,t1b];

  const roundNumber = (currentMatches[0]?.roundNumber || 0) + 1;

  await addDoc(collection(db, `sessions/${currentSessionId}/matches`), {
    roundNumber,
    team1:{p1:t1a,p2:t1b}, team2:{p1:t2a,p2:t2b},
    score1:s1, score2:s2, winnerTeam, scoreDiff:diff,
    playedAt: serverTimestamp()
  });

  // update players collection
  for (const id of winIds){
    const p = playerById(id);
    await updateDoc(doc(db,'players',id), {
      totalScore:(p.totalScore||1000)+diff,
      totalWins:(p.totalWins||0)+1,
      totalGamesPlayed:(p.totalGamesPlayed||0)+1
    });
  }
  for (const id of loseIds){
    const p = playerById(id);
    await updateDoc(doc(db,'players',id), {
      totalScore:(p.totalScore||1000)-diff,
      totalLosses:(p.totalLosses||0)+1,
      totalGamesPlayed:(p.totalGamesPlayed||0)+1
    });
  }
  // update participants: gamesPlayedToday, lastPartnerId, waitingSince
  const updates = [
    [t1a,t1b],[t1b,t1a],[t2a,t2b],[t2b,t2a]
  ];
  for (const [id, partnerId] of updates){
    const part = currentParticipants.find(p=>p.id===id);
    await updateDoc(doc(db, `sessions/${currentSessionId}/participants`, id), {
      gamesPlayedToday:(part?.gamesPlayedToday||0)+1,
      lastPartnerId: partnerId,
      waitingSince: serverTimestamp()
    });
  }

  toast(t('บันทึกผลแล้ว','Result saved'), '#5B6E4E');
  pendingMatch = null;
}

      <button class="filter-btn" onclick="openFilterSheet()">⚙️ ${t('กรอง','Filter')} ${activeCount?`<span class="filter-badge">1</span>`:''}</button>
    </div>
    <div class="section-label"><span>${t('อันดับผู้เล่น','Leaderboard')} · ${list.length} ${t('คน','players')}</span></div>
    <div class="board">
      ${list.length ? list.map((p,i)=>renderPlayerCard(p,i)).join('') : `<div class="empty-note">${t('ไม่พบผู้เล่นตามเงื่อนไขนี้','No players match this filter')}</div>`}
    </div>
    <div class="footer-note">${t('Soi Sideout · เล่นด้วยกัน ทุกเสาร์','Soi Sideout · playing together every Saturday')}</div>`;
}

function renderPlayerCard(p, i){
  const rank = i+1;
  const cls = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
  const badge = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
  return `
    <div class="card ${cls}" onclick="openPlayerDetail('${p.id}')">
      <div class="rank-badge">${badge}</div>
      <div class="card-info">
        <div class="card-name">${esc(p.name)} <span class="gender-tag">${genderLabel(p.gender)}</span></div>
        <div class="card-sub">${t('เล่น','Played')} ${p.totalGamesPlayed||0} ${t('เกม','games')}</div>
      </div>
      <div class="card-stats">
        <div class="stat-score">${p.totalScore||1000}</div>
        <div class="stat-winrate">Win ${winrate(p)}%</div>
      </div>
    </div>`;
}

/* ---- ADMIN VIEW ---- */
function renderAdmin(){
  const curSession = sessions.find(s=>s.id===currentSessionId);
  return `
    ${renderHeader()}
    <div class="admin-tabs">
      <button class="admin-tab ${adminTab==='home'?'active':''}" onclick="setAdminTab('home')">🏠 ${t('หน้าแรก','Home')}</button>
      <button class="admin-tab ${adminTab==='sessions'?'active':''}" onclick="setAdminTab('sessions')">📅 ${t('Sessions','Sessions')}</button>
      <button class="admin-tab ${adminTab==='players'?'active':''}" onclick="setAdminTab('players')">👥 ${t('ผู้เล่น','Players')}</button>
      ${currentSessionId && curSession?.status==='active' ? `<button class="admin-tab ${adminTab==='live'?'active':''}" onclick="setAdminTab('live')">🔴 ${t('กำลังจัดการ','Managing')}</button>` : ''}
      ${currentSessionId && curSession?.status==='completed' ? `<button class="admin-tab ${adminTab==='summary'?'active':''}" onclick="setAdminTab('summary')">🏆 ${t('สรุปผล','Summary')}</button>` : ''}
    </div>
    ${adminTab==='home' ? renderGuestBody() : ''}
    ${adminTab==='sessions' ? renderAdminSessions() : ''}
    ${adminTab==='players' ? renderAdminPlayers() : ''}

  `;
}
window.setAdminTab = function(t){ adminTab = t; render(); }

function renderAdminSessions(){

    <div class="section-label">${t('Sessions ทั้งหมด','All sessions')}</div>
    ${sorted.length? sorted.map(s=>`
      <div class="list-item" style="align-items:flex-start;">
        <div style="flex:1;cursor:pointer;" onclick="openSessionDetail('${s.id}')">
          <div class="name">${esc(sessionTitle(s))} <span class="status-tag status-${s.status}">${s.status}</span></div>
          <div class="meta">${s.name?`${esc(fmtDate(s.date))} · `:''}📍 ${esc(s.location)} · 🕒 ${esc(s.startTime)}-${esc(s.endTime)}</div>

        <div style="display:flex;flex-direction:column;gap:6px;">
          ${s.status==='upcoming'?`<button class="btn btn-olive btn-sm" onclick="startSession('${s.id}')">${t('เริ่ม','Start')}</button>`:''}
          ${s.status==='active'?`<button class="btn btn-outline btn-sm" onclick="openSessionDetail('${s.id}')">${t('จัดการ','Manage')}</button>`:''}
          ${s.status==='completed'?`<button class="btn btn-outline btn-sm" onclick="openSessionDetail('${s.id}')">🏆 ${t('สรุปผล','Summary')}</button>`:''}
          <button class="btn btn-danger btn-sm" onclick="deleteSessionConfirm('${s.id}')">${t('ลบ','Delete')}</button>

      </div>`).join('') : `<div class="empty-note">${t('ยังไม่มี session','No sessions yet')}</div>`}

}

  const sorted = [...players].sort((a,b)=>(b.totalScore||0)-(a.totalScore||0));

    <button class="btn btn-primary btn-block" style="margin-bottom:16px;" onclick="openAddPlayer()">+ ${t('เพิ่มผู้เล่นใหม่','Add new player')}</button>

      <div class="list-item" style="cursor:pointer;" onclick="openPlayerDetail('${p.id}')">

          <div class="name">${esc(p.name)} <span class="gender-tag">${genderLabel(p.gender)}</span></div>
          <div class="meta">${p.totalScore||1000} ${t('คะแนน','pts')} · Win ${winrate(p)}% · ${p.totalGamesPlayed||0} ${t('เกม','games')}</div>

      <div style="font-size:12px;color:#8A7D6C;margin-bottom:12px;line-height:1.5;">
        ${t('ล้างข้อมูลผู้เล่น, session, และประวัติการแข่งขันทั้งหมด ใช้สำหรับล้างข้อมูลทดสอบก่อนเริ่มใช้งานจริง','Clear all players, sessions, and match history. Use this to wipe test data before going live.')}
      </div>
      <button class="btn btn-danger btn-block" onclick="openResetConfirm()">🗑️ ${t('ล้างข้อมูลทั้งหมด','Reset all data')}</button>

function renderAdminLive(){
  const session = sessions.find(s=>s.id===currentSessionId);
  if (!session) return `<div class="empty-note">${t('ไม่พบ session','Session not found')}</div>`;
  const active = currentParticipants.filter(p=>p.status==='active');
  const leftEarly = currentParticipants.filter(p=>p.status==='left_early');
  const checkedInIds = currentParticipants.map(p=>p.id);
  const notCheckedIn = [...players].filter(p=>!checkedInIds.includes(p.id)).sort((a,b)=>a.name.localeCompare(b.name));

  return `
    <div class="banner ${session.status==='active'?'live':''}" style="margin-bottom:14px;">
      <div class="banner-eyebrow"><span class="dot ${session.status==='active'?'pulse':''}"></span>${session.status}</div>
      <div class="banner-title display">${esc(sessionTitle(session))}</div>
      <div class="banner-meta">${session.name?`<span>📅 ${esc(fmtDate(session.date))}</span>`:''}<span>📍 ${esc(session.location)}</span><span>🕒 ${esc(session.startTime)}-${esc(session.endTime)}</span></div>
    </div>

    ${pendingMatch ? renderPendingMatch() : `
      <button class="btn btn-primary btn-block" style="margin-bottom:16px;" onclick="generateMatch()">🎲 ${t('สุ่มจับคู่ Match ถัดไป','Generate next match')}</button>`}

    <div class="section-label">${t('Check-in ผู้เล่น','Check-in players')}</div>
    <div class="field" style="margin-bottom:8px;">
      <select id="checkinSelect">
        <option value="">${t(`— เลือกผู้เล่น (${notCheckedIn.length} คนในระบบ) —`, `— Select player (${notCheckedIn.length} in database) —`)}</option>
        ${notCheckedIn.map(p=>`<option value="${p.id}">${esc(p.name)} (${genderLabel(p.gender)})</option>`).join('')}
      </select>
    </div>
    <div class="row2" style="margin-bottom:16px;">
      <button class="btn btn-olive btn-block" onclick="checkInFromDropdown()">✅ ${t('Check-in','Check-in')}</button>
      <button class="btn btn-outline btn-block" onclick="openAddPlayer((newId)=>checkInPlayer(newId))">+ ${t('เพิ่มผู้เล่นใหม่','Add new player')}</button>
    </div>

    <div class="section-label">${t('Active วันนี้','Active today')} · ${active.length} ${t('คน','players')}</div>
    ${active.length? active.map(p=>`
      <div class="list-item">
        <div>
          <div class="name">${esc(p.name)} <span class="gender-tag">${genderLabel(p.gender)}</span></div>
          <div class="meta">${t('เล่นแล้ว','Played')} ${p.gamesPlayedToday||0} ${t('เกมวันนี้','games today')}</div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="markLeftEarly('${p.id}')">${t('ออกก่อน','Left early')}</button>
      </div>`).join('') : `<div class="empty-note">${t('ยังไม่มีผู้เล่น check-in','No players checked in yet')}</div>`}

    ${leftEarly.length? `
      <div class="section-label" style="margin-top:16px;">${t('ออกก่อนจบ','Left early')} · ${leftEarly.length} ${t('คน','players')}</div>
      ${leftEarly.map(p=>`
        <div class="list-item">
          <div class="name">${esc(p.name)} <span class="status-tag status-left">${t('ออกก่อน','left early')}</span></div>
          <button class="btn btn-outline btn-sm" onclick="reactivatePlayer('${p.id}')">${t('กลับมา Active','Reactivate')}</button>
        </div>`).join('')}
    ` : ''}

    <div class="section-label" style="margin-top:16px;">${t('ผลการแข่งขันวันนี้','Match results today')}</div>
    ${currentMatches.length? currentMatches.map(m=>renderMatchHistory(m)).join('') : `<div class="empty-note">${t('ยังไม่มีการแข่งขัน','No matches yet')}</div>`}

    <div class="row2" style="margin-top:20px;">
      <button class="btn btn-outline btn-block" onclick="setAdminTab('sessions')">${t('กลับหน้า Sessions','Back to Sessions')}</button>
      ${session.status==='active'?`<button class="btn btn-danger btn-block" onclick="completeSession('${session.id}')">${t('จบ Session','End Session')}</button>`:''}
    </div>
  `;
}

function computeSessionStats(){
  const stats = {};
  currentParticipants.forEach(p=>{
    stats[p.id] = { id:p.id, name:p.name, gender:p.gender, wins:0, losses:0, netScore:0, gamesPlayed:0 };
  });
  currentMatches.forEach(m=>{
    const t1ids = [m.team1.p1, m.team1.p2];
    const t2ids = [m.team2.p1, m.team2.p2];
    const w1 = m.winnerTeam===1;
    t1ids.forEach(id=>{
      if (!stats[id]) stats[id] = { id, name: playerById(id)?.name || '?', gender: playerById(id)?.gender||'M', wins:0, losses:0, netScore:0, gamesPlayed:0 };
      stats[id].gamesPlayed++;
      if (w1){ stats[id].wins++; stats[id].netScore += m.scoreDiff; } else { stats[id].losses++; stats[id].netScore -= m.scoreDiff; }
    });
    t2ids.forEach(id=>{
      if (!stats[id]) stats[id] = { id, name: playerById(id)?.name || '?', gender: playerById(id)?.gender||'M', wins:0, losses:0, netScore:0, gamesPlayed:0 };
      stats[id].gamesPlayed++;
      if (!w1){ stats[id].wins++; stats[id].netScore += m.scoreDiff; } else { stats[id].losses++; stats[id].netScore -= m.scoreDiff; }
    });
  });
  return Object.values(stats).sort((a,b)=> b.wins-a.wins || b.netScore-a.netScore);
}

function renderAdminSummary(){
  const session = sessions.find(s=>s.id===currentSessionId);
  if (!session) return `<div class="empty-note">${t('ไม่พบ session','Session not found')}</div>`;
  const ranked = computeSessionStats();
  return `
    <div class="banner" style="margin-bottom:14px;">
      <div class="banner-eyebrow"><span class="dot"></span>${t('สรุปผล League','League summary')}</div>
      <div class="banner-title display">${esc(sessionTitle(session))}</div>
      <div class="banner-meta">
        ${session.name?`<span>📅 ${esc(fmtDate(session.date))}</span>`:''}
        <span>📍 ${esc(session.location)}</span>
      </div>
    </div>
    <div class="section-label">${t('อันดับประจำวัน','Ranking for this session')} · ${ranked.length} ${t('คน','players')}</div>
    <div class="board">
      ${ranked.length ? ranked.map((p,i)=>{
        const rank=i+1;
        const cls = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
        const badge = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
        return `
        <div class="card ${cls}" onclick="openPlayerDetail('${p.id}')">
          <div class="rank-badge">${badge}</div>
          <div class="card-info">
            <div class="card-name">${esc(p.name)} <span class="gender-tag">${genderLabel(p.gender)}</span></div>
            <div class="card-sub">${p.wins}${t('ชนะ','W')} - ${p.losses}${t('แพ้','L')} · ${p.gamesPlayed} ${t('เกม','games')}</div>
          </div>
          <div class="card-stats">
            <div class="stat-score">${p.netScore>0?'+':''}${p.netScore}</div>
            <div class="stat-winrate">${t('คะแนนสุทธิ','net score')}</div>
          </div>
        </div>`;
      }).join('') : `<div class="empty-note">${t('ไม่มีข้อมูลการแข่งขัน','No match data')}</div>`}
    </div>
    <div class="section-label" style="margin-top:20px;">${t('ตารางการแข่งขันทั้งหมด','All matches this session')} · ${currentMatches.length} ${t('แมตช์','matches')}</div>
    ${currentMatches.length ? currentMatches.map(m=>renderMatchHistory(m)).join('') : `<div class="empty-note">${t('ไม่มีการแข่งขัน','No matches')}</div>`}
    <button class="btn btn-outline btn-block" style="margin-top:20px;" onclick="setAdminTab('sessions')">${t('กลับหน้า Sessions','Back to Sessions')}</button>
  `;
}

function renderPendingMatch(){
  const [t1a,t1b] = pendingMatch.team1;
  const [t2a,t2b] = pendingMatch.team2;
  const p1a=playerById(t1a), p1b=playerById(t1b), p2a=playerById(t2a), p2b=playerById(t2b);
  return `
    <div class="match-card" style="margin-bottom:16px;">
      <div class="section-label" style="margin:0 0 10px;">${t('Match ใหม่ — กรอกคะแนนแล้วบันทึก','New match — enter scores and save')}</div>
      <div class="team-row">
        <div class="team-names">${esc(p1a?.name)} + ${esc(p1b?.name)}</div>
        <input class="score-input" id="scoreT1" type="number" placeholder="0">
      </div>
      <div class="vs-label">VS</div>
      <div class="team-row">
        <div class="team-names">${esc(p2a?.name)} + ${esc(p2b?.name)}</div>
        <input class="score-input" id="scoreT2" type="number" placeholder="0">
      </div>
      <div class="row2" style="margin-top:12px;">
        <button class="btn btn-outline btn-block" onclick="reshuffleMatch()">🔄 ${t('สุ่มใหม่','Reshuffle')}</button>
        <button class="btn btn-outline btn-block" onclick="cancelPendingMatch()">${t('ยกเลิก','Cancel')}</button>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="confirmAndRecordMatch()">✅ ${t('ยืนยันบันทึกผล','Confirm & save result')}</button>
    </div>`;
}

function renderMatchHistory(m){
  const p1a=playerById(m.team1.p1), p1b=playerById(m.team1.p2);
  const p2a=playerById(m.team2.p1), p2b=playerById(m.team2.p2);
  const w1 = m.winnerTeam===1;
  return `
    <div class="match-card">
      <div style="font-size:11px;color:#B3A594;font-weight:700;margin-bottom:6px;">${t('รอบที่','Round')} ${m.roundNumber}</div>
      <div class="team-row">
        <div class="team-names" style="color:${w1?'var(--olive)':'var(--ink)'}">${w1?'🏆 ':''}${esc(p1a?.name)} + ${esc(p1b?.name)}</div>
        <div class="team-names">${m.score1}</div>
      </div>
      <div class="team-row">
        <div class="team-names" style="color:${!w1?'var(--olive)':'var(--ink)'}">${!w1?'🏆 ':''}${esc(p2a?.name)} + ${esc(p2b?.name)}</div>
        <div class="team-names">${m.score2}</div>
      </div>
    </div>`;
}

applyStaticTranslations();
render();
</script>
