<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>จับคู่พิกเกิลบอล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --court-blue:#164a6b;
    --court-blue-deep:#0d3450;
    --kitchen-teal:#12766e;
    --line:#f4f1e6;
    --ball:#d7e836;
    --ink:#0f1e26;
    --ink-soft:#4c6270;
    --card-bg:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#eef1ec;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,var(--court-blue) 0%,var(--court-blue-deep) 100%);
    padding:38px 20px 54px;
    color:var(--line);
  }
  .hero svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55;}
  .hero-content{position:relative;z-index:1;max-width:640px;margin:0 auto;}
  .eyebrow{
    font-family:'Roboto Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ball);
    margin:0 0 10px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(30px,7vw,44px);
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:.01em;
  }
  .hero p{margin:0;color:#cfe0e6;font-size:15px;max-width:46ch;}

  main{max-width:640px;margin:-28px auto 60px;padding:0 16px;position:relative;z-index:2;}
  section.panel{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 10px 30px -14px rgba(13,52,80,.28);
    padding:20px;
    margin-bottom:16px;
  }
  h2{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--court-blue-deep);
    margin:0 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  h2 .num{
    font-family:'Roboto Mono',monospace;
    background:var(--court-blue);
    color:var(--line);
    font-size:11px;
    width:20px;height:20px;
    border-radius:5px;
    display:inline-flex;align-items:center;justify-content:center;
  }

  .name-row{display:flex;gap:8px;margin-bottom:12px;}
  input[type=text]{
    flex:1;
    border:1.5px solid #dfe4de;
    border-radius:10px;
    padding:11px 13px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus{border-color:var(--kitchen-teal);}
  .btn{
    border:none;
    border-radius:10px;
    padding:11px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .08s ease, opacity .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--court-blue-deep);color:var(--line);}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{background:#eef1ec;color:var(--ink-soft);}
  .btn-full{width:100%;padding:14px;font-size:15px;}
  .btn-ball{background:var(--ball);color:var(--court-blue-deep);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:8px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:#f2f6f2;
    border:1px solid #e1e8e0;
    border-radius:999px;
    padding:7px 6px 7px 13px;
    font-size:13.5px;
    font-weight:500;
  }
  .chip button{
    border:none;background:#dfe6de;color:var(--ink-soft);
    width:18px;height:18px;border-radius:50%;
    font-size:12px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .empty-hint{color:#9aa79f;font-size:13px;font-style:italic;}

  .mode-toggle{display:flex;background:#eef1ec;border-radius:10px;padding:4px;gap:4px;}
  .mode-toggle button{
    flex:1;border:none;background:transparent;padding:10px 6px;border-radius:8px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--ink-soft);
    cursor:pointer;transition:.15s;
  }
  .mode-toggle button.active{background:var(--court-blue-deep);color:var(--line);}
  .field-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .field-row label{font-size:13.5px;color:var(--ink-soft);font-weight:500;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{
    width:30px;height:30px;border-radius:8px;border:1.5px solid #dfe4de;background:#fff;
    font-size:16px;cursor:pointer;color:var(--court-blue-deep);
  }
  .stepper span{font-family:'Roboto Mono',monospace;font-weight:600;min-width:14px;text-align:center;}

  .round-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .round-header .label{font-family:'Oswald',sans-serif;font-size:16px;color:var(--court-blue-deep);}

  .match-card{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:12px;
    border:1px solid #dbe6da;
    background:var(--line);
  }
  .match-court{
    display:flex;
    position:relative;
    min-height:96px;
  }
  .match-court::before{
    content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;
    background:repeating-linear-gradient(to bottom, #ffffffaa 0 6px, transparent 6px 12px);
    transform:translateX(-1px);
  }
  .side{
    flex:1;
    padding:14px 12px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
  }
  .side.a{background:var(--court-blue);color:var(--line);}
  .side.b{background:var(--kitchen-teal);color:var(--line);}
  .side .team-label{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.1em;opacity:.7;text-transform:uppercase;}
  .side .team-names{font-family:'Oswald',sans-serif;font-size:15px;line-height:1.25;}
  .match-meta{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;background:#fff;border-top:1px solid #eef1ec;
    font-size:12.5px;color:var(--ink-soft);
  }
  .court-tag{
    font-family:'Roboto Mono',monospace;
    background:#eef1ec;padding:2px 8px;border-radius:6px;color:var(--court-blue-deep);font-weight:600;
  }
  .score-row{display:flex;align-items:center;gap:8px;}
  .score-row input{
    width:40px;text-align:center;border:1.5px solid #dfe4de;border-radius:7px;
    padding:5px 2px;font-family:'Roboto Mono',monospace;font-weight:600;font-size:14px;
  }
  .score-row span{color:#c3cbc1;}
  .save-btn{
    font-size:12px;padding:6px 10px;border-radius:7px;border:none;
    background:var(--court-blue-deep);color:var(--line);cursor:pointer;font-weight:600;
  }
  .save-btn.saved{background:var(--kitchen-teal);}
  .bye-card{
    border-radius:12px;border:1.5px dashed #cdd6cb;padding:14px;text-align:center;
    color:var(--ink-soft);font-size:13.5px;margin-bottom:12px;background:#f7f9f6;
  }
  .bye-card b{color:var(--ink);}

  .leaderboard-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid #eef1ec;
  }
  .leaderboard-row:last-child{border-bottom:none;}
  .lb-name{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;}
  .lb-rank{
    font-family:'Roboto Mono',monospace;font-size:12px;color:#9aa79f;width:16px;
  }
  .lb-wins{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--kitchen-teal);font-weight:700;}

  footer{text-align:center;color:#9aa79f;font-size:12px;padding:0 20px 30px;}
</style>
</head>
<body>

<div class="hero">
  <svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice">
    <rect x="20" y="20" width="360" height="180" fill="none" stroke="#f4f1e644" stroke-width="3"/>
    <line x1="200" y1="20" x2="200" y2="200" stroke="#f4f1e644" stroke-width="3"/>
    <rect x="20" y="20" width="70" height="180" fill="none" stroke="#d7e83630" stroke-width="2"/>
    <rect x="310" y="20" width="70" height="180" fill="none" stroke="#d7e83630" stroke-width="2"/>
    <circle cx="330" cy="60" r="9" fill="#d7e836" opacity="0.85"/>
  </svg>
  <div class="hero-content">
    <p class="eyebrow">Court • Kitchen • Rotation</p>
    <h1>จับคู่พิกเกิลบอลกัน</h1>
    <p>ใส่ชื่อผู้เล่น เลือกเดี่ยวหรือคู่ แล้วให้ระบบสุ่มจับคู่แข่งในแต่ละรอบให้อัตโนมัติ</p>
  </div>
</div>

<main>
  <section class="panel">
    <h2><span class="num">1</span>รายชื่อผู้เล่น</h2>
    <div class="name-row">
      <input type="text" id="nameInput" placeholder="พิมพ์ชื่อผู้เล่น แล้วกด Enter" maxlength="20">
      <button class="btn btn-primary" id="addBtn">เพิ่ม</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="panel">
    <h2><span class="num">2</span>รูปแบบการเล่น</h2>
    <div class="mode-toggle">
      <button id="modeSingle" class="active">เดี่ยว (Singles)</button>
      <button id="modeDouble">คู่ (Doubles)</button>
    </div>
    <div class="field-row">
      <label>จำนวนคอร์ตที่ใช้พร้อมกัน</label>
      <div class="stepper">
        <button id="courtMinus">−</button>
        <span id="courtCount">1</span>
        <button id="courtPlus">+</button>
      </div>
    </div>
  </section>

  <button class="btn btn-ball btn-full" id="generateBtn">🎾 สุ่มจับคู่รอบถัดไป</button>

  <section id="matchesSection" style="margin-top:18px;"></section>

  <section class="panel" id="leaderboardPanel" style="display:none;">
    <h2><span class="num">★</span>สรุปผลชนะ</h2>
    <div id="leaderboard"></div>
  </section>
</main>

<footer>ทำสด ไม่บันทึกข้อมูลข้ามเซสชัน — เริ่มใหม่ทุกครั้งที่เปิดหน้านี้</footer>

<script>
(function(){
  let players = []; // {id, name, wins}
  let mode = 'singles';
  let courts = 1;
  let roundNum = 0;
  let history = {}; // pairKey -> count (tracks who has played/partnered with whom)
  let currentMatches = []; // {id, teamA:[names], teamB:[names], court, saved}

  const chipsEl = document.getElementById('chips');
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  const modeSingleBtn = document.getElementById('modeSingle');
  const modeDoubleBtn = document.getElementById('modeDouble');
  const courtCountEl = document.getElementById('courtCount');
  const generateBtn = document.getElementById('generateBtn');
  const matchesSection = document.getElementById('matchesSection');
  const leaderboardPanel = document.getElementById('leaderboardPanel');
  const leaderboardEl = document.getElementById('leaderboard');

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function addPlayer(name){
    name = name.trim();
    if(!name) return;
    if(players.some(p => p.name.toLowerCase() === name.toLowerCase())){
      nameInput.value='';
      return;
    }
    players.push({id: uid(), name, wins:0});
    nameInput.value='';
    renderChips();
    updateGenerateState();
  }

  function removePlayer(id){
    players = players.filter(p => p.id !== id);
    renderChips();
    updateGenerateState();
  }

  function renderChips(){
    if(players.length === 0){
      chipsEl.innerHTML = '<span class="empty-hint">ยังไม่มีผู้เล่น — เพิ่มชื่ออย่างน้อย 4 คนเพื่อเริ่ม</span>';
      return;
    }
    chipsEl.innerHTML = players.map(p => `
      <span class="chip">${escapeHtml(p.name)}<button data-id="${p.id}" aria-label="ลบ ${escapeHtml(p.name)}">✕</button></span>
    `).join('');
    chipsEl.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=> removePlayer(btn.dataset.id));
    });
  }

  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function updateGenerateState(){
    const minNeeded = mode === 'singles' ? 2 : 4;
    generateBtn.disabled = players.length < minNeeded;
    generateBtn.textContent = players.length < minNeeded
      ? `🎾 ต้องมีผู้เล่นอย่างน้อย ${minNeeded} คน`
      : '🎾 สุ่มจับคู่รอบถัดไป';
  }

  addBtn.addEventListener('click', ()=> addPlayer(nameInput.value));
  nameInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); addPlayer(nameInput.value); }
  });

  modeSingleBtn.addEventListener('click', ()=>{
    mode='singles';
    modeSingleBtn.classList.add('active');
    modeDoubleBtn.classList.remove('active');
    updateGenerateState();
  });
  modeDoubleBtn.addEventListener('click', ()=>{
    mode='doubles';
    modeDoubleBtn.classList.add('active');
    modeSingleBtn.classList.remove('active');
    updateGenerateState();
  });

  document.getElementById('courtMinus').addEventListener('click', ()=>{
    courts = Math.max(1, courts-1);
    courtCountEl.textContent = courts;
  });
  document.getElementById('courtPlus').addEventListener('click', ()=>{
    courts = Math.min(8, courts+1);
    courtCountEl.textContent = courts;
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function pairKey(a,b){
    return [a,b].sort().join('__');
  }

  function historyScore(group){
    // sum of how many times these players have already faced/partnered each other
    let score = 0;
    for(let i=0;i<group.length;i++){
      for(let j=i+1;j<group.length;j++){
        score += history[pairKey(group[i],group[j])] || 0;
      }
    }
    return score;
  }

  function recordHistory(group){
    for(let i=0;i<group.length;i++){
      for(let j=i+1;j<group.length;j++){
        const k = pairKey(group[i],group[j]);
        history[k] = (history[k]||0) + 1;
      }
    }
  }

  function bestOfShuffles(playerIds, groupSize, attempts){
    // try several random orderings, keep the one with lowest total repeat-history score
    let best = null, bestScore = Infinity;
    for(let t=0;t<attempts;t++){
      const shuffled = shuffle(playerIds);
      const groups = [];
      for(let i=0;i+groupSize<=shuffled.length;i+=groupSize){
        groups.push(shuffled.slice(i,i+groupSize));
      }
      const leftover = shuffled.slice(Math.floor(shuffled.length/groupSize)*groupSize);
      const score = groups.reduce((s,g)=> s+historyScore(g), 0);
      if(score < bestScore){
        bestScore = score;
        best = {groups, leftover};
      }
    }
    return best;
  }

  function generateRound(){
    roundNum++;
    const ids = players.map(p=>p.id);
    const nameOf = id => players.find(p=>p.id===id).name;
    currentMatches = [];
    let byeIds = [];

    if(mode === 'singles'){
      const {groups, leftover} = bestOfShuffles(ids, 2, 60);
      byeIds = leftover;
      groups.forEach((g,i)=>{
        recordHistory(g);
        currentMatches.push({
          id: uid(),
          teamA: [nameOf(g[0])],
          teamB: [nameOf(g[1])],
          idsA: [g[0]], idsB:[g[1]],
          court: (i % courts) + 1,
          saved:false
        });
      });
    } else {
      const {groups, leftover} = bestOfShuffles(ids, 4, 60);
      byeIds = leftover;
      groups.forEach((g,i)=>{
        // within the 4, choose best teamA/teamB split by lowest partner-history
        const splits = [
          [[g[0],g[1]],[g[2],g[3]]],
          [[g[0],g[2]],[g[1],g[3]]],
          [[g[0],g[3]],[g[1],g[2]]]
        ];
        let bestSplit = splits[0], bestSplitScore = Infinity;
        splits.forEach(s=>{
          const sc = historyScore(s[0]) + historyScore(s[1]);
          if(sc < bestSplitScore){ bestSplitScore = sc; bestSplit = s; }
        });
        recordHistory(g); // record full foursome interaction
        currentMatches.push({
          id: uid(),
          teamA: bestSplit[0].map(nameOf),
          teamB: bestSplit[1].map(nameOf),
          idsA: bestSplit[0], idsB: bestSplit[1],
          court: (i % courts) + 1,
          saved:false
        });
      });
    }

    renderMatches(byeIds.map(nameOf));
  }

  function renderMatches(byeNames){
    let html = `<div class="round-header"><span class="label">รอบที่ ${roundNum}</span><button class="btn btn-ghost" id="regenBtn">สุ่มใหม่รอบนี้</button></div>`;

    currentMatches.forEach(m=>{
      html += `
      <div class="match-card" data-id="${m.id}">
        <div class="match-court">
          <div class="side a">
            <span class="team-label">ฝั่ง A</span>
            <span class="team-names">${m.teamA.map(escapeHtml).join(' & ')}</span>
          </div>
          <div class="side b">
            <span class="team-label">ฝั่ง B</span>
            <span class="team-names">${m.teamB.map(escapeHtml).join(' & ')}</span>
          </div>
        </div>
        <div class="match-meta">
          <span class="court-tag">คอร์ต ${m.court}</span>
          <div class="score-row">
            <input type="number" min="0" class="scoreA" placeholder="0">
            <span>–</span>
            <input type="number" min="0" class="scoreB" placeholder="0">
            <button class="save-btn">บันทึก</button>
          </div>
        </div>
      </div>`;
    });

    if(byeNames.length){
      html += `<div class="bye-card">พักรอบนี้: <b>${byeNames.map(escapeHtml).join(', ')}</b></div>`;
    }

    matchesSection.innerHTML = html;

    document.getElementById('regenBtn').addEventListener('click', ()=>{
      roundNum--; // regenerating same round, not advancing
      generateRound();
    });

    matchesSection.querySelectorAll('.match-card').forEach(card=>{
      const id = card.dataset.id;
      const m = currentMatches.find(x=>x.id===id);
      const saveBtn = card.querySelector('.save-btn');
      saveBtn.addEventListener('click', ()=>{
        const sa = parseInt(card.querySelector('.scoreA').value, 10);
        const sb = parseInt(card.querySelector('.scoreB').value, 10);
        if(isNaN(sa) || isNaN(sb)){ return; }
        if(sa === sb){ return; }
        const winners = sa > sb ? m.idsA : m.idsB;
        winners.forEach(wid=>{
          const p = players.find(pl=>pl.id===wid);
          if(p) p.wins++;
        });
        saveBtn.textContent = 'บันทึกแล้ว ✓';
        saveBtn.classList.add('saved');
        saveBtn.disabled = true;
        card.querySelector('.scoreA').disabled = true;
        card.querySelector('.scoreB').disabled = true;
        renderLeaderboard();
      });
    });
  }

  function renderLeaderboard(){
    const sorted = players.slice().sort((a,b)=> b.wins - a.wins);
    if(sorted.every(p=>p.wins===0)){
      leaderboardPanel.style.display = 'none';
      return;
    }
    leaderboardPanel.style.display = 'block';
    leaderboardEl.innerHTML = sorted.map((p,i)=>`
      <div class="leaderboard-row">
        <div class="lb-name"><span class="lb-rank">${i+1}</span>${escapeHtml(p.name)}</div>
        <div class="lb-wins">${p.wins} ชนะ</div>
      </div>
    `).join('');
  }

  generateBtn.addEventListener('click', generateRound);

  renderChips();
  updateGenerateState();
})();
</script>
</body>
</html>
